<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <title>Plantctl</title>
    <link rel="stylesheet" href="/style.css" />
    <script type="module" src="/app.js"></script>
    <script type="module" src="/schedule.js"></script>
  </head>
  <body>
    <header>
      <a class="brand" href="/" aria-label="Plantctl 首页"
        ><span aria-hidden="true">✳</span> plantctl</a
      >
      <span id="connection" class="connection" role="status">连接中</span>
    </header>
    <main>
      <h1>我的设备</h1>
      <article class="device" aria-labelledby="device-name">
        <div
          id="device-visual"
          class="illustration"
          data-state="unknown"
          aria-hidden="true"
        >
          <svg viewBox="0 0 400 400" fill="none">
            <defs>
              <linearGradient
                id="beam"
                x1="200"
                y1="80"
                x2="200"
                y2="340"
                gradientUnits="userSpaceOnUse"
              >
                <stop stop-color="#b9db8b" stop-opacity=".18" />
                <stop offset="1" stop-color="#b9db8b" stop-opacity="0" />
              </linearGradient>
              <linearGradient
                id="pot"
                x1="150"
                y1="280"
                x2="250"
                y2="340"
                gradientUnits="userSpaceOnUse"
              >
                <stop stop-color="#525a4e" />
                <stop offset="1" stop-color="#30382e" />
              </linearGradient>
            </defs>
            <path
              class="light-beam"
              d="M150 83L66 342H334L250 83Z"
              fill="url(#beam)"
            />
            <path d="M200 0V59" stroke="#606958" stroke-width="2" />
            <path d="M163 61H237L255 82H145Z" fill="#69785a" />
            <rect
              class="light-strip"
              x="145"
              y="81"
              width="110"
              height="4"
              rx="2"
              fill="#d0e9ab"
            />
            <ellipse
              cx="200"
              cy="343"
              rx="81"
              ry="9"
              fill="#080c08"
              fill-opacity=".5"
            />
            <path
              d="M200 289Q198 220 230 159M202 265Q180 213 149 199M202 251Q229 220 269 223"
              stroke="#748a5c"
              stroke-width="4"
            />
            <path
              d="M217 192Q201 145 250 127Q264 172 217 192Z"
              fill="#8baf68"
            />
            <path
              d="M190 244Q144 244 129 195Q178 190 190 244Z"
              fill="#587d4d"
            />
            <path
              d="M211 250Q230 204 278 217Q264 260 211 250Z"
              fill="#76965b"
            />
            <path
              d="M203 222Q170 204 175 166Q213 172 203 222Z"
              fill="#465f3b"
            />
            <path d="M156 286H245L232 337H169Z" fill="url(#pot)" />
            <rect
              x="151"
              y="279"
              width="99"
              height="12"
              rx="3"
              fill="#626d57"
            />
          </svg>
        </div>
        <div class="device-readings">
          <div class="device-heading">
            <h2 id="device-name">植物补光灯</h2>
            <span id="state-badge" class="badge">待确认</span>
          </div>
          <div class="reading"><strong id="power">—</strong><span>W</span></div>
          <div class="metrics">
            <div><span>电压</span><strong id="voltage">— V</strong></div>
            <div><span>累计用电</span><strong id="energy">— kWh</strong></div>
          </div>
        </div>
        <form id="schedule-form" class="control-panel">
          <h2>控制</h2>
          <div class="mode-tabs" role="tablist" aria-label="控制模式">
            <button
              id="tab-manual"
              type="button"
              role="tab"
              aria-selected="false"
              aria-controls="manual-panel"
              disabled
            >
              手动
            </button>
            <button
              id="tab-auto"
              type="button"
              role="tab"
              aria-selected="false"
              aria-controls="schedule-editor"
              tabindex="-1"
              disabled
            >
              自动
            </button>
          </div>
          <div
            id="manual-panel"
            class="manual-panel"
            role="tabpanel"
            aria-labelledby="tab-manual"
            hidden
          >
            <div class="actions">
              <button id="on" type="button" disabled>开灯</button>
              <button id="off" type="button" class="secondary" disabled>
                关灯
              </button>
            </div>
          </div>
          <div
            id="schedule-editor"
            class="schedule-editor"
            data-disabled="true"
            role="tabpanel"
            aria-labelledby="tab-auto"
            hidden
          >
            <div
              id="schedule-dial"
              class="dial"
              role="group"
              aria-label="每日开灯时段，24 小时表盘"
            >
              <svg viewBox="0 0 320 320" aria-hidden="true">
                <circle class="dial-track" cx="160" cy="160" r="116" />
                <g class="dial-ticks"></g>
                <path class="dial-arc" />
                <text x="160" y="16">00</text>
                <text x="305" y="165">06</text>
                <text x="160" y="314">12</text>
                <text x="15" y="165">18</text>
              </svg>
              <div class="dial-centre">
                <span>每天亮灯</span
                ><strong class="dial-duration">14 小时</strong>
              </div>
              <button
                type="button"
                class="dial-handle on"
                data-edge="on"
                role="slider"
                aria-label="开启时间"
                aria-valuemin="0"
                aria-valuemax="1439"
                aria-valuenow="480"
                aria-valuetext="08:00"
                disabled
              >
                开
              </button>
              <button
                type="button"
                class="dial-handle off"
                data-edge="off"
                role="slider"
                aria-label="关闭时间"
                aria-valuemin="0"
                aria-valuemax="1439"
                aria-valuenow="1320"
                aria-valuetext="22:00"
                disabled
              >
                关
              </button>
            </div>
            <div class="dial-values">
              <button
                type="button"
                data-pick="on"
                aria-label="选择开启时间，再点按圆环调整"
                aria-pressed="true"
                disabled
              >
                <span>开启</span><strong>08:00</strong>
              </button>
              <button
                type="button"
                data-pick="off"
                aria-label="选择关闭时间，再点按圆环调整"
                aria-pressed="false"
                disabled
              >
                <span>关闭</span><strong>22:00</strong>
              </button>
            </div>
          </div>
          <p id="feedback" role="status" aria-live="polite" hidden></p>
          <p id="schedule-feedback" role="alert" hidden></p>
        </form>
      </article>
    </main>
  </body>
</html>
