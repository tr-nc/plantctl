<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <title>Plantctl</title>
    <link rel="stylesheet" href="/style.css" />
    <script type="module" src="/app.js"></script>
    <script type="module" src="/schedule.js"></script>
  </head>
  <body>
    <header>
      <a class="brand" href="/" aria-label="Plantctl 首页"
        ><span aria-hidden="true">✳</span> plantctl</a
      >
      <span id="connection" class="connection" role="status">连接中</span>
    </header>
    <main>
      <h1>我的设备<span class="count">01</span></h1>
      <article class="device" aria-labelledby="device-name">
        <div
          id="device-visual"
          class="illustration"
          data-state="unknown"
          aria-hidden="true"
        >
          <svg viewBox="0 0 400 400" fill="none">
            <defs>
              <linearGradient
                id="beam"
                x1="200"
                y1="80"
                x2="200"
                y2="340"
                gradientUnits="userSpaceOnUse"
              >
                <stop stop-color="#b9db8b" stop-opacity=".18" />
                <stop offset="1" stop-color="#b9db8b" stop-opacity="0" />
              </linearGradient>
              <linearGradient
                id="pot"
                x1="150"
                y1="280"
                x2="250"
                y2="340"
                gradientUnits="userSpaceOnUse"
              >
                <stop stop-color="#525a4e" />
                <stop offset="1" stop-color="#30382e" />
              </linearGradient>
            </defs>
            <path
              class="light-beam"
              d="M150 83L66 342H334L250 83Z"
              fill="url(#beam)"
            />
            <path d="M200 0V59" stroke="#606958" stroke-width="2" />
            <path d="M163 61H237L255 82H145Z" fill="#69785a" />
            <rect
              class="light-strip"
              x="145"
              y="81"
              width="110"
              height="4"
              rx="2"
              fill="#d0e9ab"
            />
            <ellipse
              cx="200"
              cy="343"
              rx="81"
              ry="9"
              fill="#080c08"
              fill-opacity=".5"
            />
            <path
              d="M200 289Q198 220 230 159M202 265Q180 213 149 199M202 251Q229 220 269 223"
              stroke="#748a5c"
              stroke-width="4"
            />
            <path
              d="M217 192Q201 145 250 127Q264 172 217 192Z"
              fill="#8baf68"
            />
            <path
              d="M190 244Q144 244 129 195Q178 190 190 244Z"
              fill="#587d4d"
            />
            <path
              d="M211 250Q230 204 278 217Q264 260 211 250Z"
              fill="#76965b"
            />
            <path
              d="M203 222Q170 204 175 166Q213 172 203 222Z"
              fill="#465f3b"
            />
            <path d="M156 286H245L232 337H169Z" fill="url(#pot)" />
            <rect
              x="151"
              y="279"
              width="99"
              height="12"
              rx="3"
              fill="#626d57"
            />
          </svg>
        </div>
        <div class="controls">
          <div class="device-heading">
            <h2 id="device-name">植物补光灯</h2>
            <span id="state-badge" class="badge">待确认</span>
          </div>
          <div class="reading"><strong id="power">—</strong><span>W</span></div>
          <div class="metrics">
            <div><span>电压</span><strong id="voltage">— V</strong></div>
            <div><span>累计用电</span><strong id="energy">— kWh</strong></div>
          </div>
          <div class="actions">
            <button id="on" disabled>开灯</button
            ><button id="off" class="secondary" disabled>关灯</button>
          </div>
          <div class="status-row">
            <p id="feedback" role="status" aria-live="polite">正在连接…</p>
            <button
              id="refresh"
              class="refresh"
              aria-label="刷新设备状态"
              title="刷新设备状态"
              disabled
            >
              ↻
            </button>
          </div>
          <form id="schedule-form" class="schedule">
            <div class="schedule-heading">
              <label for="schedule-enabled">自动开关</label>
              <span class="switch">
                <input
                  id="schedule-enabled"
                  type="checkbox"
                  role="switch"
                  disabled
                />
                <span aria-hidden="true"></span>
              </span>
            </div>
            <div class="schedule-times">
              <label for="schedule-on"
                >开启时间<input
                  id="schedule-on"
                  type="time"
                  value="08:00"
                  required
                  disabled
              /></label>
              <label for="schedule-off"
                >关闭时间<input
                  id="schedule-off"
                  type="time"
                  value="22:00"
                  required
                  disabled
              /></label>
              <button id="schedule-save" type="submit" disabled>保存</button>
            </div>
            <p id="schedule-feedback" role="status" aria-live="polite">
              正在加载…
            </p>
            <p class="schedule-hint">
              启用或改时后立即按时段执行；手动开关保持到下次定时。
            </p>
          </form>
        </div>
      </article>
    </main>
  </body>
</html>
