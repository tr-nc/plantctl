# Included by the dedicated plantctl-web nginx instance, not the system instance.
worker_processes 1;
pid /run/plantctl-web/nginx.pid;
error_log stderr warn;
events { worker_connections 128; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log off; # Never log the WebSocket authentication token in query strings.
    server_tokens off;
    client_max_body_size 1k;
    client_body_temp_path /run/plantctl-web/client;
    proxy_temp_path /run/plantctl-web/proxy;
    fastcgi_temp_path /run/plantctl-web/fastcgi;
    uwsgi_temp_path /run/plantctl-web/uwsgi;
    scgi_temp_path /run/plantctl-web/scgi;
    server {
        listen 80;
        server_name _;
        allow 127.0.0.1;
        allow 192.168.50.0/24;
        deny all;
        root /opt/plantctl-web;
        add_header Cache-Control no-store always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'" always;
        location = /api {
            # Do not allow third-party pages to use this authenticated proxy.
            if ($http_origin != "http://$http_host") { return 403; }
            proxy_pass http://127.0.0.1:8080;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_read_timeout 90s;
            error_log /dev/null; # Upstream errors can include the token-bearing request URI.
        }
        location = / { try_files /index.html =404; }
        location = /index.html { }
        location = /style.css { }
        location = /app.js { }
        location / { return 404; }
    }
}
